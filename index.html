<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Redirecting to M-Corp AI</title>

  <link rel="canonical" href="https://mcorpai.org/">

  <!-- JavaScript가 꺼져 있어도 즉시 이동 -->
  <meta http-equiv="refresh" content="0;url=https://mcorpai.org/">

  <!-- 이전 리다이렉트 페이지가 캐시되는 것을 방지 -->
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">

  <script>
    'use strict';

    // 뒤로가기를 눌렀을 때 다시 리다이렉트 페이지로 돌아오지 않도록 처리
    window.location.replace('https://mcorpai.org/');
  </script>
</head>
<body>
  <main>
    <p>
      자동으로 이동하지 않으면
      <a href="https://mcorpai.org/">https://mcorpai.org/</a>을 눌러 주세요.
    </p>
  </main>
</body>
</html>
